name: Ladybird Android APK (arm64 + armv7)

# Builds BOTH the arm64-v8a (64-bit) and armeabi-v7a (32-bit ARMv7) APKs
# from the ORIGINAL Ladybird repo (LadybirdBrowser/ladybird) and publishes
# both APKs in one GitHub Release in this repo.
#
# Triggers:
#  - every push to this repository (auto build + auto release)
#  - every 7 days automatically (weekly cron)
#  - manually via the "Run workflow" button (workflow_dispatch)

on:
  push:
    branches: [master]
  schedule:
    # Every Monday 00:00 UTC = every 7 days
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

env:
  LADYBIRD_CACHE_DIR: ${{ github.workspace }}/Build/caches
  VCPKG_ROOT: /opt/vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Checkout original Ladybird repo (master)
        uses: actions/checkout@v7.0.1
        with:
          repository: LadybirdBrowser/ladybird
          ref: master
          fetch-depth: 1

      - name: Compute version name and tag
        id: ver
        run: |
          BUILD_DATE=$(date -u +%Y%m%d)
          FULL_SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          VERSION="1.0-nightly-${BUILD_DATE}-${SHORT_SHA}"
          TAG="nightly-${BUILD_DATE}-${SHORT_SHA}"
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "full_sha=${FULL_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install system build tools (for vcpkg ports)
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake autoconf-archive libtool pkg-config nasm

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Rust toolchain (pinned by Ladybird) + Android targets
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup target add --toolchain 1.98.0 aarch64-linux-android armv7-linux-androideabi

      - name: Install wasm-tools
        run: |
          VERSION=1.243.0
          FILE="wasm-tools-${VERSION}-x86_64-linux.tar.gz"
          curl -fsSL -o "$FILE" "https://github.com/bytecodealliance/wasm-tools/releases/download/v${VERSION}/${FILE}"
          tar -xzf "$FILE"
          mv "wasm-tools-${VERSION}-x86_64-linux/wasm-tools" /usr/local/bin/
          rm -rf "$FILE" "wasm-tools-${VERSION}-x86_64-linux"
          wasm-tools --version

      - name: Install Android SDK components (NDK, CMake, SDK 35)
        run: |
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "build-tools;35.0.0" \
            "platforms;android-35" \
            "cmake;3.31.6" \
            "ndk;29.0.13599879" > /dev/null

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-binary-cache
          key: vcpkg-android-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-android-
            vcpkg-arm64-android-

      - name: Set up vcpkg (pinned to Ladybird's builtin-baseline)
        run: |
          REV=$(python3 -c "import json; print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git /opt/vcpkg
          git -C /opt/vcpkg checkout "$REV"
          /opt/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          echo "Using vcpkg at baseline: $REV"

      - name: Allow a real native compiler for meson cross-ports
        run: |
          # vcpkg's default none.txt makes the build-machine compiler 'false',
          # which breaks Ladybird's libpsl overlay port (its meson.build needs a
          # native C compiler). Provide a proper x86_64-linux native file.
          cat > /opt/vcpkg/scripts/buildsystems/meson/none.txt <<'NATIVEFILE'
          [host_machine]
          system = 'linux'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'

          [properties]

          [binaries]
          c = '/usr/bin/gcc'
          cpp = '/usr/bin/g++'
          ar = '/usr/bin/gcc-ar'
          strip = '/usr/bin/strip'
          pkgconfig = '/usr/bin/pkg-config'
          NATIVEFILE
          echo "--- patched none.txt ---"
          cat /opt/vcpkg/scripts/buildsystems/meson/none.txt

      - name: Patch Android app build (version name + upstream workarounds)
        run: |
          sed -i "s/versionCode = 1$/versionCode = ${BUILD_DATE}/" UI/Android/build.gradle.kts
          sed -i "s/versionName = \"1.0\"/versionName = \"${VERSION}\"/" UI/Android/build.gradle.kts
          # LibGfx needs harfbuzz on every platform; upstream's vcpkg.json
          # forgot to include it for Android. Add it here (same features as Linux).
          sed -i 's/"platform": "linux | bsd | windows"/"platform": "linux | bsd | windows | android"/' vcpkg.json
          # Upstream Android-only typo: post_event() takes an EventReceiver*, not a reference.
          sed -i 's/post_event(notifier, Core::Event::Type::NotifierActivation)/post_event(\&notifier, Core::Event::Type::NotifierActivation)/' Libraries/LibCore/EventLoopImplementationUnix.cpp
          # libc crate does not expose shm_open/shm_unlink on Android; use the
          # memfd_create path instead (Android supports memfd_create).
          sed -i 's|#\[cfg(target_os = "linux")\]|#[cfg(any(target_os = "linux", target_os = "android"))]|' Libraries/LibIPC/Rust/src/shared_memory.rs
          sed -i 's|#\[cfg(not(target_os = "linux"))\]|#[cfg(not(any(target_os = "linux", target_os = "android")))]|' Libraries/LibIPC/Rust/src/shared_memory.rs
          # Seccomp.cpp (which defines set_connect_broker_fd) is excluded on
          # Android, but helper main.cpp files still call it. Add an inline no-op.
          python3 - <<'PY'
          p = 'Libraries/LibSandbox/ConnectBroker.h'
          s = open(p).read()
          s = s.replace('void set_connect_broker_fd(int);', '''#if defined(AK_OS_ANDROID)
          inline void set_connect_broker_fd(int) {}
          #else
          void set_connect_broker_fd(int);
          #endif''')
          open(p, 'w').write(s)

          # SystemFFmpeg.cpp / SystemFFmpegDecoders.cpp are not built on Android,
          # but these guard only on AK_OS_LINUX (which is also defined on Android).
          for p in ['Libraries/LibMedia/DecoderRegistrations.cpp', 'Services/MediaServer/main.cpp']:
              s = open(p).read()
              s = s.replace('#ifdef AK_OS_LINUX', '#if defined(AK_OS_LINUX) && !defined(AK_OS_ANDROID)')
              s = s.replace('#if defined(AK_OS_LINUX)', '#if defined(AK_OS_LINUX) && !defined(AK_OS_ANDROID)')
              # Don't double-negate the already-correct guard.
              s = s.replace('defined(AK_OS_LINUX) && !defined(AK_OS_ANDROID) && !defined(AK_OS_ANDROID)', 'defined(AK_OS_LINUX) && !defined(AK_OS_ANDROID)')
              open(p, 'w').write(s)
          PY
          echo "--- patched build.gradle.kts (version/abi lines) ---"
          grep -nE "versionCode|versionName|abiFilters" UI/Android/build.gradle.kts
        env:
          BUILD_DATE: ${{ steps.ver.outputs.build_date }}
          VERSION: ${{ steps.ver.outputs.version }}

      - name: Build arm64-v8a and armeabi-v7a release APKs
        run: |
          set -euo pipefail
          build_abi() {
            ABI="$1"
            LABEL="$2"
            RUST_TRIPLE="$3"
            echo "===== Building APK for ABI: ${ABI} (Rust target: ${RUST_TRIPLE}) ====="
            sed -i "s/abiFilters += listOf(.*)/abiFilters += listOf(\"${ABI}\")/" UI/Android/build.gradle.kts
            # Ladybird's CMake defaults the Rust target to the host; force the Android triple.
            sed -i '/RUST_TARGET_TRIPLE/d' UI/Android/build.gradle.kts
            sed -i "s/\"-DVCPKG_TARGET_ANDROID=ON\"/\"-DVCPKG_TARGET_ANDROID=ON\", \"-DRUST_TARGET_TRIPLE=${RUST_TRIPLE}\"/" UI/Android/build.gradle.kts
            grep -nE "abiFilters|RUST_TARGET_TRIPLE" UI/Android/build.gradle.kts
            # Make sure no CMake/ABI state leaks between the two builds.
            rm -rf UI/Android/.cxx UI/Android/build
            ( cd UI/Android && ./gradlew --no-daemon assembleRelease )
            UNSIGNED=$(find UI/Android/build/outputs/apk/release -name '*.apk' | head -n 1)
            echo "Unsigned ${LABEL} APK: $UNSIGNED"
            cp "$UNSIGNED" "${LABEL}-unsigned.apk"
          }
          build_abi arm64-v8a arm64 aarch64-linux-android
          build_abi armeabi-v7a armv7 armv7-linux-androideabi
        env:
          GRADLE_OPTS: '-Xmx3072m'

      - name: Sign both APKs
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias ladybird \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ladybird-sign-2026 -keypass ladybird-sign-2026 \
            -dname "CN=Ladybird Android, OU=CI, O=niggetron, L=Internet, S=Internet, C=US"
          BT="${ANDROID_SDK_ROOT}/build-tools/35.0.0"
          for LABEL in arm64 armv7; do
            "$BT/zipalign" -f 4 "${LABEL}-unsigned.apk" "${LABEL}-aligned.apk"
            "$BT/apksigner" sign \
              --ks release.keystore \
              --ks-pass pass:ladybird-sign-2026 \
              --key-pass pass:ladybird-sign-2026 \
              --out "Ladybird-${{ steps.ver.outputs.version }}-${LABEL}.apk" \
              "${LABEL}-aligned.apk"
            "$BT/apksigner" verify "Ladybird-${{ steps.ver.outputs.version }}-${LABEL}.apk"
            ls -lh "Ladybird-${{ steps.ver.outputs.version }}-${LABEL}.apk"
          done

      - name: Publish to GitHub Releases
        run: |
          ARM64="Ladybird-${{ steps.ver.outputs.version }}-arm64.apk"
          ARMV7="Ladybird-${{ steps.ver.outputs.version }}-armv7.apk"
          COMMIT_URL="https://github.com/LadybirdBrowser/ladybird/commit/${{ steps.ver.outputs.full_sha }}"
          BODY=$(cat <<EOF
          Automated Android builds of **Ladybird** (64-bit and 32-bit ARM), built from the
          original repository [LadybirdBrowser/ladybird](https://github.com/LadybirdBrowser/ladybird)
          @ \`${{ steps.ver.outputs.short_sha }}\`.

          | | |
          |---|---|
          | App versionName | \`${{ steps.ver.outputs.version }}\` |
          | Upstream commit | $COMMIT_URL |
          | Built | ${{ steps.ver.outputs.build_date }} (UTC) |
          | ABIs | arm64-v8a (64-bit), armeabi-v7a (32-bit ARMv7) |
          | Requires | Android 11+ (API 30) |

          ### Which APK do I need?
          - **$ARM64** — for almost all modern 64-bit Android phones/tablets.
          - **$ARMV7** — for older 32-bit ARM devices (only install this on a 32-bit device).

          > Note: these APKs are signed with an auto-generated CI key, not the Play Store key.
          > Ladybird Android is a work-in-progress port; expect bugs.
          EOF
          )
          gh release create "${{ steps.ver.outputs.tag }}" "$ARM64" "$ARMV7" \
            --title "Ladybird Android ${{ steps.ver.outputs.version }}" \
            --notes "$BODY" \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
